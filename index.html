<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ration Token Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-2">राशन अपॉइंटमेंट टोकन पोर्टल</h2>
        <p class="text-sm text-gray-500 text-center mb-6">अपना टोकन स्लॉट बुक करने के लिए राशन कार्ड नंबर दर्ज करें</p>

        <!-- Step 1: Card Input -->
        <div id="searchSection" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">राशन कार्ड नंबर:</label>
                <input type="text" id="cardInput" placeholder="उदा. 21XXXXXX0177" 
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="fetchCardDetails()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                नाम देखें
            </button>
        </div>

        <div id="alertMsg" class="hidden mt-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- Step 2: Show Name & Take Mobile Number for Token -->
        <div id="tokenSection" class="hidden mt-6 border border-gray-200 rounded-lg p-4 bg-gray-50 space-y-4">
            <div class="text-sm">
                <span class="text-gray-600">कार्ड धारक का नाम:</span>
                <div id="holderName" class="text-xl font-bold text-blue-800 mt-1"></div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">मोबाइल नंबर (10 अंक):</label>
                <input type="text" id="mobileInput" placeholder="अपना मोबाइल नंबर डालें" max-length="10"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-md focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button onclick="generateToken()" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">
                टोकन बुक करें
            </button>
        </div>

        <!-- Success Result -->
        <div id="tokenResult" class="hidden mt-6 p-4 border-2 border-dashed border-green-500 bg-green-50 rounded-lg text-center space-y-2">
            <h3 class="text-lg font-bold text-green-800">टोकन सफलतापूर्वक बुक हो गया!</h3>
            <p class="text-sm text-gray-600">आपका टोकन नंबर:</p>
            <div id="tokenNumber" class="text-3xl font-extrabold text-green-700"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://muppmxhvcuujyswhurhf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_gaL0eMS5A2RcV8Ig6IidaA_M2Ak7LwO";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCardData = null;

        async function fetchCardDetails() {
            const cardInput = document.getElementById('cardInput').value.trim();
            const alertMsg = document.getElementById('alertMsg');
            const tokenSection = document.getElementById('tokenSection');

            alertMsg.classList.add('hidden');
            tokenSection.classList.add('hidden');

            if (!cardInput) {
                showAlert('कृपया राशन कार्ड नंबर दर्ज करें।', 'bg-red-100 text-red-700');
                return;
            }

            const { data, error } = await _supabase
                .from('cards')
                .select('*')
                .eq('card_number', cardInput)
                .maybeSingle();

            if (error || !data) {
                showAlert('राशन कार्ड नंबर नहीं मिला!', 'bg-red-100 text-red-700');
                return;
            }

            currentCardData = data;
            document.getElementById('holderName').innerText = data.holder_name || 'उपलब्ध नहीं';
            tokenSection.classList.remove('hidden');
        }

        function generateToken() {
            const mobile = document.getElementById('mobileInput').value.trim();
            if(!mobile || mobile.length < 10) {
                alert('कृपया सही मोबाइल नंबर दर्ज करें।');
                return;
            }

            const randomToken = "TKN-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('tokenNumber').innerText = randomToken;
            document.getElementById('tokenSection').classList.add('hidden');
            document.getElementById('tokenResult').classList.remove('hidden');
        }

        function showAlert(msg, classes) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = `mt-4 p-3 rounded-lg text-sm text-center ${classes}`;
            alertMsg.innerText = msg;
            alertMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
