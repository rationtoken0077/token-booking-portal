<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Ration Card Booking Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .booking-card { max-width: 450px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        .success-msg { color: green; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="booking-card">
    <h2>Ration Booking (Testing Mode)</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label>Ration Card Number:</label>
            <input type="text" id="rationCardInput" placeholder="Enter Ration Card No." required onkeyup="checkRationCard()">
        </div>

        <div class="form-group">
            <label>Card Holder Name (Auto-Fetch):</label>
            <input type="text" id="holderNameInput" placeholder="Match hone par naam aayega" readonly style="background-color: #e9ecef;">
        </div>

        <div class="form-group">
            <label>User Name (Booking karne wale ka naam):</label>
            <input type="text" id="userNameInput" placeholder="Apna Naam Likhein" required>
        </div>

        <button type="submit">Book Ration Slot</button>
    </form>

    <div id="msg" class="success-msg">Booking Successful! (Test Mode)</div>
</div>

<script>
    // Demo Database (Jo HTML data aapne nikala tha usko yahan rakha hai)
    const rationDatabase = {
        "21XXXXXX6726": {
            holderName: "राम देवी",
            fatherHusbandName: "लालमन मौर्य",
            motherName: "रामवती देवी",
            units: 4,
            regDate: "01/06/2019"
        },
        "21XXXXXX1234": {
            holderName: "शीला देवी",
            fatherHusbandName: "राम कुमार",
            motherName: "सुमित्रा देवी",
            units: 3,
            regDate: "15/08/2020"
        }
    };

    // Ration Card check karne ka function
    function checkRationCard() {
        let cardNo = document.getElementById("rationCardInput").value.trim();
        let holderField = document.getElementById("holderNameInput");

        // Agar database me match mila toh Asli Naam aayega
        if (rationDatabase[cardNo]) {
            holderField.value = rationDatabase[cardNo].holderName;
        } else {
            // Galat ya unmatched number hone par bhi testing ke liye blank/demo naam rahega
            holderField.value = "Guest/Unverified Holder";
        }
    }

    // Form submit event
    document.getElementById("bookingForm").addEventListener("submit", function(e) {
        e.preventDefault();

        let cardNo = document.getElementById("rationCardInput").value.trim();
        let userName = document.getElementById("userNameInput").value.trim();
        let holderName = document.getElementById("holderNameInput").value;

        // Data ko localStorage me save kar rahe hain taaki Admin dekh sake
        let details = rationDatabase[cardNo] || {
            fatherHusbandName: "N/A (Testing)",
            motherName: "N/A (Testing)",
            units: "N/A"
        };

        let newBooking = {
            cardNo: cardNo,
            userName: userName,
            holderName: holderName,
            fatherName: details.fatherHusbandName,
            motherName: details.motherName,
            units: details.units,
            time: new Date().toLocaleTimeString()
        };

        let existingBookings = JSON.parse(localStorage.getItem("adminBookings")) || [];
        existingBookings.push(newBooking);
        localStorage.setItem("adminBookings", JSON.stringify(existingBookings));

        document.getElementById("msg").style.display = "block";
        document.getElementById("bookingForm").reset();
    });
</script>

</body>
</html>
