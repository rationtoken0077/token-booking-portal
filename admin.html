<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Distribution Portal - Admin Console</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #0f172a; }
    .done-row { background-color: #f0fdf4 !important; }
    summary::-webkit-details-marker { display:none; }
    
    .printable-slip { background: #ffffff; color: #0f172a; border: 2px solid #0f172a; font-family: 'Poppins', sans-serif; }
    .printable-slip.red-card-theme {
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%) !important;
      border: 3px solid #dc2626 !important;
      box-shadow: 0 20px 35px -5px rgba(220, 38, 38, 0.25) !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 pb-12">

  <div id="authOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 border border-slate-200">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-slate-100 text-slate-900 rounded-2xl mx-auto flex items-center justify-center font-bold">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="font-black text-lg text-slate-900">Admin Authentication</h2>
        <p class="text-xs text-slate-500">Kripya admin password darj karein</p>
      </div>
      <form onsubmit="verifyAdminPassword(event)" class="space-y-3">
        <input type="password" id="adminPasswordInput" placeholder="Password darj karein..." required class="w-full border border-slate-300 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-900">
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3 rounded-xl text-sm transition shadow-md">
          Login Karein
        </button>
      </form>
    </div>
  </div>

  <div id="adminMainContent" class="hidden flex min-h-screen">
    
    <aside class="w-20 bg-slate-900 text-white flex flex-col items-center py-6 border-r border-slate-800 shrink-0 sticky top-0 h-screen z-40">
      <div class="space-y-6 flex flex-col items-center w-full">
        <div class="p-2.5 bg-slate-800 text-white rounded-2xl border border-slate-700 shadow-sm">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div class="w-10 h-px bg-slate-800"></div>

        <button onclick="switchTab('home')" id="navHomeBtn" title="Home Dashboard" class="w-12 h-12 rounded-2xl bg-slate-800 text-white flex items-center justify-center shadow-md transition hover:bg-slate-700 border border-slate-700">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('tokens')" id="navTokensBtn" title="Token Register" class="w-12 h-12 rounded-2xl bg-transparent text-slate-400 flex items-center justify-center transition hover:bg-slate-800 hover:text-white">
          <i data-lucide="users" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('masterTracker')" id="navTrackerBtn" title="Master Pending List" class="w-12 h-12 rounded-2xl bg-transparent text-slate-400 flex items-center justify-center transition hover:bg-slate-800 hover:text-white">
          <i data-lucide="clipboard-list" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('cardManager')" id="navManagerBtn" title="Card Manager" class="w-12 h-12 rounded-2xl bg-transparent text-slate-400 flex items-center justify-center transition hover:bg-slate-800 hover:text-white">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="mt-auto pt-4 flex flex-col items-center gap-3 w-full">
        <button onclick="loadAllData()" title="Refresh Data" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center transition border border-slate-700">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button onclick="logoutAdmin()" title="Log Out" class="w-10 h-10 rounded-xl bg-red-500/20 text-red-400 hover:bg-red-600 hover:text-white flex items-center justify-center transition border border-red-500/30">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-slate-100">
      
      <header class="bg-white text-slate-900 border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex justify-between items-center shadow-xs">
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight leading-none text-slate-900">FPS Token Management System</h1>
          <p class="text-xs text-slate-500 mt-1">Local Distribution Console (Kapil Dev Yadav - Gujarpar)</p>
        </div>
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2 bg-slate-100 border border-slate-300 px-3 py-1.5 rounded-xl">
            <span class="text-xs font-bold text-slate-700">वितरण स्थिति (Portal Live):</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="portalLiveToggle" onchange="togglePortalLiveStatus(this)" class="sr-only peer">
              <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

          <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Admin Live
          </span>
        </div>
      </header>

      <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
        <!-- Baki tabs aur content same rahenge -->
        <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
          <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
            <i data-lucide="tv" class="text-purple-700 w-5 h-5"></i>
            <h2 class="font-bold text-sm text-slate-800">Live Token Counter & Distribution Date Control</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div class="bg-purple-50 border border-purple-200 px-4 py-3 rounded-2xl flex items-center justify-between">
              <div>
                <span class="text-[10px] font-bold text-purple-700 uppercase block">Active Display Token</span>
                <span class="text-2xl font-black text-purple-950 font-['Poppins']" id="adminLiveDisplayToken">001</span>
              </div>
              <button onclick="toggleLiveDisplayState()" id="adminDisplayToggleBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-sm transition">
                Start
              </button>
            </div>
            <div class="md:col-span-2 bg-slate-50 border border-slate-200 px-4 py-3 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-800">वितरण की तारीख सेट करें:</label>
              </div>
              <select id="activeDistributionDate" onchange="updateActiveDistributionDate(this.value)" class="bg-white border border-slate-300 text-slate-900 text-xs font-bold rounded-xl px-3 py-2 outline-none w-full sm:w-auto">
                <option value="">-- तारीख चुनें --</option>
              </select>
            </div>
          </div>
        </div>

        <div id="tabContentHome" class="space-y-6">
          <p class="text-xs text-slate-500">Dashboard active.</p>
        </div>
      </main>
    </div>
  </div>

  <script>
    const ADMIN_SECRET_PASSWORD = "kapil2026"; 
    const SUPABASE_URL = "https://muppmxhvcuujyswhurhf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gaL0eMS5A2RcV8Ig6IidaA_M2Ak7LwO";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
      if (sessionStorage.getItem("adminAuth") === "true") {
        unlockAdminPanel();
      }
      checkPortalLiveStatusState();
      lucide.createIcons();
    };

    async function checkPortalLiveStatusState() {
      try {
        const { data } = await supabaseClient.from('settings').select('*').limit(1).single();
        if (data) {
          var isLive = data.is_live !== undefined ? data.is_live : true;
          document.getElementById('portalLiveToggle').checked = (isLive === true || isLive === 'true');
        }
      } catch(e) {}
    }

    async function togglePortalLiveStatus(checkbox) {
      var isLive = checkbox.checked;
      try {
        const { error } = await supabaseClient.from('settings').update({ is_live: isLive }).eq('id', 1);
        if (error) {
          await supabaseClient.from('settings').upsert({ id: 1, is_live: isLive });
        }
      } catch(e) {}
    }

    function verifyAdminPassword(e) {
      e.preventDefault();
      if (document.getElementById('adminPasswordInput').value === ADMIN_SECRET_PASSWORD) {
        sessionStorage.setItem("adminAuth", "true");
        unlockAdminPanel();
      } else {
        alert('Galat password!');
      }
    }

    function unlockAdminPanel() {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('adminMainContent').classList.remove('hidden');
    }

    function logoutAdmin() {
      sessionStorage.removeItem("adminAuth");
      location.reload();
    }
  </script>
</body>
</html>
