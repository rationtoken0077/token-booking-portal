<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - Token Management</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { 
      background: #f8fafc; 
      color: #0f172a; 
      min-height: 100vh; 
      font-family: 'Outfit', 'Poppins', sans-serif; 
    }
    .hindi-text { font-family: 'Poppins', sans-serif; }
    .card-red-theme {
      background: #fef2f2 !important;
      border: 2px solid #ef4444 !important;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15) !important;
    }
    .card-white-theme {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05) !important;
    }
  </style>
</head>
<body class="p-3 sm:p-6 max-w-4xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 bg-slate-900 text-white p-4 sm:p-6 rounded-2xl shadow-lg">
    <div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight hindi-text">एडमिन डैशबोर्ड (Admin Portal)</h1>
      <p class="text-xs text-slate-300 mt-1 hindi-text">राशन कार्ड विवरण एवं टोकन मैनेजमेंट</p>
    </div>
    <button onclick="loadAdminData()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      <span class="hindi-text">रिफ्रेश</span>
    </button>
  </div>

  <!-- Filter & Summary -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
      <div class="p-3 bg-red-100 text-red-600 rounded-xl">
        <i data-lucide="shield-alert" class="w-6 h-6"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-500 hindi-text">अंत्योदय (Red Cards)</p>
        <p class="text-xl font-black text-red-600" id="redCardCount">0</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
      <div class="p-3 bg-slate-100 text-slate-700 rounded-xl">
        <i data-lucide="credit-card" class="w-6 h-6"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-500 hindi-text">सामान्य (White Cards)</p>
        <p class="text-xl font-black text-slate-800" id="whiteCardCount">0</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
      <div class="p-3 bg-emerald-100 text-emerald-700 rounded-xl">
        <i data-lucide="users" class="w-6 h-6"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-500 hindi-text">कुल बुक टोकन</p>
        <p class="text-xl font-black text-emerald-600" id="totalBookingsCount">0</p>
      </div>
    </div>
  </div>

  <!-- Bookings List Section -->
  <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200 shadow-sm">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5 border-b pb-4">
      <h2 class="text-lg font-black text-slate-900 hindi-text flex items-center gap-2">
        <i data-lucide="list-ordered" class="w-5 h-5 text-amber-500"></i>
        टोकन बुकिंग लिस्ट
      </h2>
      <div class="w-full sm:w-auto flex items-center gap-2">
        <input type="text" id="searchInput" placeholder="कार्ड नं या नाम से खोजें..." onkeyup="filterBookings()" class="w-full sm:w-64 px-3.5 py-2 border rounded-xl text-xs bg-slate-50 outline-none focus:border-slate-800">
      </div>
    </div>

    <!-- Booking Cards Container -->
    <div id="bookingsContainer" class="space-y-4">
      <div class="text-center py-8 text-slate-400 text-xs hindi-text">डेटा लोड हो रहा है...</div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Supabase Configuration
    const SUPABASE_URL = "https://muppmxhvcuujyswhurhf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gaL0eMS5A2RcV8Ig6IidaA_M2Ak7LwO";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Complete Red Card (Antyodaya) Extended Database with Units & Father/Husband Name
    const redCardDetails = {
      "219120522054": { name: "रामकरण यादव", husband_father: "राम सुंदर यादव", units: 5 },
      "21XXXXXX0177": { name: "राधिका", husband_father: "राम अचल", units: 4 },
      "21XXXXXX0694": { name: "रुना देवी", husband_father: "श्याम लाल", units: 3 },
      "21XXXXXX8940": { name: "लालती", husband_father: "राम औतार", units: 6 },
      "21XXXXXX9894": { name: "फूलबासी", husband_father: "राम मिलन", units: 2 },
      "21XXXXXX5294": { name: "सविता देवी", husband_father: "दिनेश यादव", units: 5 },
      "21XXXXXX2846": { name: "फूलमती", husband_father: "राम अजोर", units: 4 },
      "21XXXXXX2046": { name: "चम्पा", husband_father: "राम निहोर", units: 3 },
      "21XXXXXX2047": { name: "फेकनी", husband_father: "राम सरन", units: 5 },
      "21XXXXXX2840": { name: "निर्मला", husband_father: "सुरेश चंद", units: 4 },
      "21XXXXXX3127": { name: "राजमती", husband_father: "राम सागर", units: 2 },
      "21XXXXXX5297": { name: "परंजोती देवी", husband_father: "शिव पूजन", units: 6 },
      "21XXXXXX9857": { name: "पतिक", husband_father: "राम प्यारे", units: 1 },
      "21XXXXXX3220": { name: "राधिका", husband_father: "हरि राम", units: 3 },
      "21XXXXXX9855": { name: "फूलमती", husband_father: "राम लगन", units: 4 },
      "21XXXXXX2855": { name: "सावित्री", husband_father: "राम चरित्र", units: 5 },
      "21XXXXXX2045": { name: "चम्पा", husband_father: "राम किशुन", units: 2 },
      "21XXXXXX5708": { name: "फूला देवी", husband_father: "राम जियावन", units: 4 },
      "21XXXXXX9853": { name: "देवती देवी", husband_father: "राम लखन", units: 3 }
    };

    let allBookings = [];

    window.onload = function() {
      loadAdminData();
    };

    async function loadAdminData() {
      const container = document.getElementById('bookingsContainer');
      container.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs hindi-text">डेटा लोड हो रहा है...</div>';

      try {
        const { data, error } = await supabaseClient
          .from('bookings')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        allBookings = data || [];
        renderBookings(allBookings);
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-center py-8 text-red-500 text-xs hindi-text">डेटा लोड करने में असमर्थ! Supabase कनेक्शन जांचें।</div>';
      }
    }

    function renderBookings(list) {
      const container = document.getElementById('bookingsContainer');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs hindi-text">कोई टोकन बुकिंग उपलब्ध नहीं है।</div>';
        document.getElementById('redCardCount').innerText = '0';
        document.getElementById('whiteCardCount').innerText = '0';
        document.getElementById('totalBookingsCount').innerText = '0';
        return;
      }

      let redCount = 0;
      let whiteCount = 0;

      list.forEach(item => {
        const cardNo = item.card || '';
        const maskedKey = cardNo.length === 12 ? cardNo.slice(0, 2) + "XXXXXX" + cardNo.slice(8) : '';
        
        // Check if Red Card
        const redData = redCardDetails[cardNo] || redCardDetails[maskedKey];
        const isRedCard = !!redData;

        if (isRedCard) redCount++;
        else whiteCount++;

        // Determine Husband/Father name & Units
        const husbandFatherName = isRedCard ? redData.husband_father : (item.husband_father || "उपलब्ध नहीं");
        const unitsCount = isRedCard ? redData.units : (item.units || "सामान्य");

        const cardElement = document.createElement('div');
        cardElement.className = `p-4 sm:p-5 rounded-2xl transition-all ${isRedCard ? 'card-red-theme' : 'card-white-theme'}`;

        cardElement.innerHTML = `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-200/60 pb-3 mb-3">
            <div class="flex items-center gap-2.5">
              ${isRedCard 
                ? `<span class="bg-red-600 text-white text-[10px] font-black px-2.5 py-1 rounded-lg uppercase tracking-wider flex items-center gap-1 shadow-sm">
                    <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> Red Card (257)
                   </span>`
                : `<span class="bg-slate-200 text-slate-700 text-[10px] font-black px-2.5 py-1 rounded-lg uppercase tracking-wider flex items-center gap-1">
                    <i data-lucide="credit-card" class="w-3.5 h-3.5"></i> Normal White Card (942)
                   </span>`
              }
              <span class="text-xs font-bold text-slate-500">📅 ${item.token_date || '-'}</span>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-500 font-extrabold uppercase block">Token Number</span>
              <span class="text-lg font-black ${isRedCard ? 'text-red-700' : 'text-slate-900'}">
                #${item.token_number ? String(item.token_number).padStart(3, '0') : '-'}
              </span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div>
              <span class="text-slate-500 font-bold block hindi-text">कार्डधारक का नाम:</span>
              <span class="font-black text-slate-900 text-sm hindi-text">${item.name || redData?.name || '-'}</span>
            </div>

            <div>
              <span class="text-slate-500 font-bold block hindi-text">पति / पिता का नाम:</span>
              <span class="font-extrabold text-slate-800 hindi-text">${husbandFatherName}</span>
            </div>

            <div>
              <span class="text-slate-500 font-bold block hindi-text">राशन कार्ड नंबर:</span>
              <span class="font-extrabold text-slate-900 tracking-wide">${cardNo}</span>
            </div>

            <div>
              <span class="text-slate-500 font-bold block hindi-text">यूनिट (Members):</span>
              <span class="inline-block mt-0.5 font-black text-xs px-2.5 py-0.5 rounded-md ${isRedCard ? 'bg-red-200 text-red-900' : 'bg-slate-100 text-slate-800'}">
                ${unitsCount} Unit
              </span>
            </div>
          </div>

          <div class="mt-3 pt-2 border-t border-slate-200/60 flex justify-between items-center text-[11px] text-slate-600">
            <span>📞 मोबाइल: <strong>${item.phone || '-'}</strong></span>
            <span class="italic text-slate-400">ID: #${item.id}</span>
          </div>
        `;

        container.appendChild(cardElement);
      });

      document.getElementById('redCardCount').innerText = redCount;
      document.getElementById('whiteCardCount').innerText = whiteCount;
      document.getElementById('totalBookingsCount').innerText = list.length;

      lucide.createIcons();
    }

    function filterBookings() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderBookings(allBookings);
        return;
      }

      const filtered = allBookings.filter(item => {
        const name = (item.name || '').toLowerCase();
        const card = (item.card || '').toLowerCase();
        const phone = (item.phone || '').toLowerCase();
        return name.includes(query) || card.includes(query) || phone.includes(query);
      });

      renderBookings(filtered);
    }
  </script>
</body>
</html>
